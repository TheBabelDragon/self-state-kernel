name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python self_state_kernel.py
      - run: python tests/test_kernel_corrections.py
      - run: python tests/test_parity_vectors.py
      - name: fixture generates cleanly
        run: |
          python scripts/generate_rust_vectors.py
          python scripts/generate_rust_vectors.py --check
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: bind shared fixture into host
        run: python scripts/generate_rust_vectors.py
      - uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-none
      - name: fmt
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo run -p self-state-host
      - run: cargo check -p self-state-core --target aarch64-unknown-none
